[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostdeps"
version = "0.1.0"
description = "GhostDeps — dependency forensics and executable dependency contracts for repositories."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PrathamKapoor" }]
keywords = ["dependencies", "forensics", "reproducibility", "devops", "static-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
yaml = ["pyyaml>=6"]

[project.scripts]
ghostdeps = "ghostdeps.cli:main"

[project.urls]
Homepage = "https://github.com/PrathamKapoor/GhostDep"
Repository = "https://github.com/PrathamKapoor/GhostDep"
Issues = "https://github.com/PrathamKapoor/GhostDep/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep temp dirs inside the repo (gitignored): system temp cleanup can fail
# with PermissionError on some Windows setups and would mask test results.
addopts = "--basetemp=.pytest-tmp"
